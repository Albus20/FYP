name: AI collector offline tests
on:
  push:
    paths:
      - 'scripts/ai_research_collector/**'
      - '.github/workflows/ai-collector-tests.yml'
  pull_request:
    paths:
      - 'scripts/ai_research_collector/**'
      - '.github/workflows/ai-collector-tests.yml'
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: scripts/ai_research_collector
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -r requirements.txt
      - run: python -m unittest test_collector -v
